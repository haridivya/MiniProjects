<!DOCTYPE HTML>
<html>
    <head>
        <title>StudentRegistrationForm</title>
    </head>
    <body>
            <form>
            <label>Full Name:</label>
            <input type="text">
            <br><br>
            <label>Father Name : </label>
            <input type="text">
            <br><br>
            <label>Mother Name : </label>
            <input type="text">
            <br><br>
            <label>Date of Birth : </label>
            <input type="date">
            <br><br>
            <label>Age : </label>
            <input type="number">
            <br><br>
            <label>Gender : </label>
            <input type="radio" name="gender"><label>Male </label>
            <input type="radio" name="gender"><label>Female </label>
            <h3>Contact Details</h3>
            <label>Email : </label><input type="email">
            <br><br>
            <label>Phone Number : </label><input type="number">
            <br><br>
            <label>Address : </label><input type="text">
            <h3>Education</h3>
            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>MCA</option>
            </select>
            <br><br>
            <label for="year">Select Year:</label>
            <select id="year" name="year">
                <option>2026</option>
                <option>2025</option>
                <option>2024</option>
                <option>2023</option>
            </select>
            <h3>Skills </h3>
            <input type="checkbox"><label>HTML</label><br>
            <input type="checkbox"><label>CSS</label><br>
            <input type="checkbox"><label>JavaScript</label><br>
            <input type="checkbox"><label>Java</label><br>
            <input type="checkbox"><label>Python</label><br>


        </form>
        
    </body>
</html>
